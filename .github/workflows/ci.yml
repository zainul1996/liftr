name: Validate LIFTR
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-and-python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Set toolchain for scripts
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Swift and schema tests
        env:
          LIFTR_PYTHON: python
        run: ./scripts/test.sh
      - name: Swift formatting
        run: xcrun swift-format lint --strict --recursive packages apps tests/swift
  app-builds:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, watch]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Set toolchain for scripts
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen
      - run: ./scripts/build-${{ matrix.platform }}.sh
  simulator-ui:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, watch]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Watch simulator runtime when absent on hosted runner
        if: matrix.platform == 'watch'
        run: xcodebuild -downloadPlatform watchOS
      - name: Native simulator UI tests with explicit synthetic fixtures
        env:
          LIFTR_PYTHON: python
        run: ./scripts/test-ui.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-${{ matrix.platform }}
          path: .build/ui/results/*.xcresult
          retention-days: 7
