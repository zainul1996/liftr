name: LIFTR
options:
  bundleIdPrefix: com.zainul.liftr
  minimumXcodeGenVersion: 2.44.0
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  LIFTR:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  LIFTR:
    type: application
    platform: iOS
    sources:
      - path: apps/ios
        excludes: [Info.plist, "*.entitlements"]
      - path: apps/testing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zainul.liftr
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: config/iOS-Info.plist
      properties:
        CFBundleDisplayName: LIFTR
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: false
        NSHealthShareUsageDescription: LIFTR uses workout access to support intentional gym motion recordings.
        NSHealthUpdateUsageDescription: LIFTR can save strength training workout sessions when you choose to record.
    dependencies:
      - package: LIFTR
        product: LIFTRCore
      - package: LIFTR
        product: LIFTRPersistence
      - package: LIFTR
        product: LIFTRSync
      - target: LIFTRWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
  LIFTRWatch:
    type: application
    platform: watchOS
    sources:
      - path: apps/watch
        excludes: [Info.plist, "*.entitlements"]
      - path: apps/testing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zainul.liftr.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: config/watchOS-Info.plist
      properties:
        CFBundleDisplayName: LIFTR
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zainul.liftr
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: LIFTR requests workout access to record your strength training sessions.
        NSHealthUpdateUsageDescription: LIFTR saves workouts only when you start a recording session.
        NSMotionUsageDescription: LIFTR records wrist motion only when you intentionally start data collection.
    entitlements:
      path: config/LIFTRWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: LIFTR
        product: LIFTRCore
      - package: LIFTR
        product: LIFTRPersistence
      - package: LIFTR
        product: LIFTRSync
      - package: LIFTR
        product: LIFTRMotion
  LIFTRPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/ui/iphone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zainul.liftr.phone-uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LIFTR
    dependencies:
      - target: LIFTR
  LIFTRWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [tests/ui/watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zainul.liftr.watch-uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LIFTRWatch
    dependencies:
      - target: LIFTRWatch
schemes:
  LIFTRPhoneUITests:
    build:
      targets:
        LIFTR: all
        LIFTRPhoneUITests: [test]
    test:
      targets: [LIFTRPhoneUITests]
  LIFTRWatchUITests:
    build:
      targets:
        LIFTRWatch: all
        LIFTRWatchUITests: [test]
    test:
      targets: [LIFTRWatchUITests]
  LIFTR:
    build:
      targets:
        LIFTR: all
    run:
      config: Debug
  LIFTRWatch:
    build:
      targets:
        LIFTRWatch: all
    run:
      config: Debug
